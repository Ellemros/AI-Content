[project]
name = "ai-content-factory"
version = "0.1.0"
description = "Local pipeline for faceless short videos in English and Czech."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "integration: renders with the real Kokoro voice and FFmpeg (no mocks). Skipped when the model is missing.",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/services/offline_scripts.py" = ["E501"]
"scripts/render_first_video.py" = ["E402"]
